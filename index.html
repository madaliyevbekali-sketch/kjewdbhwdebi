<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ma’muriy huquq — test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#040306;
  --ink2:#0b0712;
  --violet:#a35cff;
  --haze:#6d35d9;
  --orchid:#e7b8ff;
  --pink:#ff9be8;
  --bone:#f5f0ff;
  --mute:rgba(245,240,255,.64);
  --line:rgba(245,240,255,.16);
  --glass:rgba(255,255,255,.045);
  --ok:#9ff0c8;
  --bad:#ff8fb1;
  --display:'Marcellus','Cinzel','Trajan Pro',Georgia,'Times New Roman',serif;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
  --pad:clamp(18px,4vw,56px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--bone);overflow:hidden}
body{
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(60% 40% at 0% 100%,rgba(140,60,255,.28),transparent 70%),
    radial-gradient(60% 40% at 100% 100%,rgba(140,60,255,.22),transparent 70%),
    radial-gradient(90% 60% at 50% -10%,rgba(60,40,110,.35),transparent 70%),
    var(--ink);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--orchid);outline-offset:3px;border-radius:6px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#burst{z-index:0}
#flower{z-index:4;opacity:0;transition:opacity 1s ease}
body[data-screen="home"] #flower{opacity:1}

/* NAV */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--safe-t) + 22px) var(--pad) 12px;
  font-family:var(--sans);font-weight:300;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
}
.nav-links{display:flex;gap:clamp(18px,4.5vw,64px)}
.nav-links button{opacity:.82;letter-spacing:.16em;text-transform:uppercase;font-size:11px;font-family:var(--sans);font-weight:300;transition:opacity .25s}
.nav-links button:hover{opacity:1}
.nav-links sup{font-size:8px;margin-left:4px;opacity:.7}
.pill{
  display:inline-flex;align-items:center;gap:10px;
  padding:11px 18px;border-radius:999px;
  border:1px solid var(--line);background:rgba(10,6,18,.55);backdrop-filter:blur(10px);
  font-family:var(--sans);font-weight:300;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  transition:border-color .3s,background .3s,box-shadow .3s;
}
.pill:hover{border-color:var(--orchid);box-shadow:0 0 26px rgba(163,92,255,.4)}
.pill svg{width:11px;height:11px}
body[data-screen="quiz"] .nav-links,
body[data-screen="quiz"] #navCta{display:none}
#navName{display:none}
body[data-screen="quiz"] #navName{display:inline-flex}

/* SCREENS */
.screen{
  position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;
  padding:calc(var(--safe-t) + 78px) var(--pad) calc(var(--safe-b) + 28px);
  opacity:0;visibility:hidden;transform:translateY(22px) scale(.99);filter:blur(14px);
  transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .7s ease,visibility 0s linear .8s;
}
.screen.on{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}

/* HOME */
#s-home{display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.title{font-family:var(--display);font-weight:400;line-height:.88;letter-spacing:-.01em;font-size:clamp(50px,13.4vw,236px);text-transform:uppercase;white-space:nowrap}
.t1{align-self:flex-start;margin-left:1vw}
.t2{align-self:flex-end;margin-right:1vw;margin-top:.06em}
.tag{position:absolute;right:var(--pad);top:30%;font-family:var(--sans);font-weight:300;font-size:clamp(10px,1.1vw,15px);letter-spacing:.1em;line-height:1.35;text-transform:uppercase;text-align:left}
.home-foot{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--safe-b) + 26px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;z-index:6}
.author{font-family:var(--display);font-size:clamp(22px,2.4vw,34px);letter-spacing:.02em}
.author small{display:block;font-family:var(--sans);font-weight:300;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:16px;font-family:var(--sans);font-weight:300;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:6px;transition:border-color .3s}
.cta:hover{border-color:var(--orchid)}
.cta svg{width:10px;height:10px}
.about{max-width:300px;font-family:var(--sans);font-weight:300;font-size:11px;line-height:1.6;letter-spacing:.04em;color:var(--mute);text-align:right}

/* NAME */
#s-name{display:flex;align-items:center;justify-content:center}
.name-wrap{width:min(920px,100%);padding:20px 0}
.h2{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.95;font-size:clamp(34px,6.6vw,92px);letter-spacing:-.005em}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,4vw,56px);margin-top:clamp(28px,5vh,56px)}
.field label{display:block;font-family:var(--sans);font-weight:300;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.field input{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  color:var(--bone);font-family:var(--display);font-size:clamp(24px,3.4vw,44px);padding:8px 0 10px;caret-color:var(--orchid);
  transition:border-color .3s;
}
.field input::placeholder{color:rgba(245,240,255,.22)}
.field input:focus{outline:none;border-color:var(--orchid);box-shadow:0 14px 24px -18px var(--violet)}
.meta{display:flex;flex-wrap:wrap;gap:12px 34px;margin-top:30px;font-family:var(--sans);font-weight:300;font-size:12px;letter-spacing:.1em;color:var(--mute)}
.meta b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--bone);letter-spacing:.02em;margin-right:6px}
.err{min-height:22px;margin-top:14px;font-family:var(--sans);font-size:13px;color:var(--bad)}
.big-btn{
  display:inline-flex;align-items:center;gap:14px;margin-top:10px;
  padding:16px 30px;border-radius:999px;border:1px solid rgba(231,184,255,.55);
  background:linear-gradient(135deg,rgba(163,92,255,.55),rgba(109,53,217,.35));
  font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  box-shadow:0 0 38px rgba(163,92,255,.32),inset 0 0 22px rgba(231,184,255,.14);
  transition:transform .3s,box-shadow .3s;
}
.big-btn:hover{transform:translateY(-2px);box-shadow:0 0 58px rgba(163,92,255,.55),inset 0 0 22px rgba(231,184,255,.2)}
.big-btn svg{width:12px;height:12px}
.big-btn.ghost{background:rgba(10,6,18,.5);border-color:var(--line);box-shadow:none}
.big-btn.ghost:hover{border-color:var(--orchid)}

/* QUIZ */
#s-quiz{display:flex;flex-direction:column}
.quiz{flex:1;display:grid;grid-template-columns:minmax(220px,.36fr) 1fr;gap:clamp(22px,5vw,80px);align-items:center;max-width:1320px;width:100%;margin:0 auto;padding:10px 0}
.q-left{align-self:center}
.topic{font-family:var(--sans);font-weight:300;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);max-width:280px;line-height:1.5;min-height:34px}
.counter{display:flex;align-items:baseline;gap:6px;margin:10px 0 18px;font-family:var(--display);line-height:1}
.counter .plus{font-size:clamp(28px,3.2vw,46px);opacity:.8}
.counter .num{font-size:clamp(84px,12vw,190px);letter-spacing:-.02em}
.counter .of{font-size:clamp(18px,1.8vw,26px);color:var(--mute);margin-left:4px}
.weight{display:inline-flex;align-items:center;gap:12px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);font-family:var(--sans);font-weight:300;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.weight b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em;color:var(--orchid)}
.q-right{min-width:0;transition:opacity .25s ease,transform .35s ease,filter .25s ease}
.q-right.out{opacity:0;transform:translateY(14px);filter:blur(10px)}
.qtext{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.35vw,32px);line-height:1.34;letter-spacing:.005em;margin-bottom:clamp(18px,3vh,32px);max-width:62ch;text-wrap:balance}
.opts{display:grid;gap:12px}
.opt{
  position:relative;display:grid;grid-template-columns:44px 1fr;gap:18px;align-items:start;text-align:left;
  padding:16px 22px 16px 16px;border-radius:22px;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);
  font-family:var(--serif);font-weight:500;font-size:clamp(17px,1.5vw,20.5px);line-height:1.45;color:rgba(245,240,255,.9);
  transition:border-color .3s,background .3s,box-shadow .35s,transform .3s;
}
.opt .ltr{
  display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);font-family:var(--display);font-size:18px;color:var(--bone);
  transition:background .3s,border-color .3s,box-shadow .3s;
}
.opt:hover{border-color:rgba(231,184,255,.55);transform:translateX(4px)}
.opt:hover .ltr{border-color:var(--orchid)}
.opt.sel{
  border-color:var(--orchid);color:#fff;transform:translateX(8px);
  background:linear-gradient(120deg,rgba(163,92,255,.34),rgba(109,53,217,.14) 60%,rgba(255,155,232,.1));
  box-shadow:0 0 44px rgba(163,92,255,.35),inset 0 0 28px rgba(231,184,255,.12);
}
.opt.sel .ltr{background:radial-gradient(circle at 35% 30%,#fff,var(--orchid) 45%,var(--violet));color:#1a0a33;border-color:transparent;box-shadow:0 0 22px rgba(231,184,255,.7)}
.q-foot{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:12px}
.ticks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tick{width:26px;height:6px;border-radius:6px;background:rgba(245,240,255,.16);transition:background .3s,width .3s,box-shadow .3s;padding:0}
.tick.ans{background:rgba(231,184,255,.55)}
.tick.cur{width:44px;background:var(--orchid);box-shadow:0 0 14px var(--violet)}
.tick:hover{background:var(--orchid)}
.ctrl{display:flex;align-items:center;gap:14px}
.circle{
  display:grid;place-items:center;width:54px;height:54px;border-radius:50%;
  border:1px solid var(--line);background:rgba(10,6,18,.55);backdrop-filter:blur(8px);
  transition:border-color .3s,box-shadow .3s,opacity .3s,transform .3s;
}
.circle:hover:not(:disabled){border-color:var(--orchid);box-shadow:0 0 28px rgba(163,92,255,.5);transform:translateY(-2px)}
.circle:disabled{opacity:.25;cursor:default}
.circle svg{width:18px;height:18px}
.next-pill{padding:0 28px;height:54px;border-radius:999px;font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.18em;text-transform:uppercase;display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(231,184,255,.55);background:linear-gradient(135deg,rgba(163,92,255,.55),rgba(109,53,217,.35));box-shadow:0 0 34px rgba(163,92,255,.3);transition:transform .3s,box-shadow .3s}
.next-pill:hover{transform:translateY(-2px);box-shadow:0 0 52px rgba(163,92,255,.55)}
.next-pill svg{width:14px;height:14px}
.warn{min-height:20px;font-family:var(--sans);font-size:13px;color:var(--pink);text-align:center}

/* RESULT */
.res{max-width:1100px;margin:0 auto;width:100%}
.res-top{display:grid;grid-template-columns:auto 1fr;gap:clamp(24px,5vw,72px);align-items:center;padding:8px 0 20px}
.ring{position:relative;width:clamp(200px,24vw,280px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:rgba(245,240,255,.12)}
.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 10px rgba(163,92,255,.8))}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(46px,6vw,80px);letter-spacing:-.02em}
.ring .pct span{font-size:.4em;margin-left:2px;color:var(--orchid)}
.who{font-family:var(--sans);font-weight:300;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.verdict{font-family:var(--display);font-size:clamp(30px,5vw,68px);line-height:1;text-transform:uppercase;margin:10px 0 24px}
.stats{display:flex;flex-wrap:wrap;gap:14px}
.stat{padding:14px 20px;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);min-width:130px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(24px,2.6vw,36px)}
.stat span{font-family:var(--sans);font-weight:300;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.stat.ok b{color:var(--ok)} .stat.no b{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin:18px 0 8px}
.rev-title{font-family:var(--display);font-size:clamp(24px,3vw,40px);text-transform:uppercase;margin:34px 0 6px}
.rev-sub{font-family:var(--sans);font-weight:300;font-size:13px;color:var(--mute);margin-bottom:18px}
.mist{display:grid;gap:14px;padding-bottom:30px}
.m{padding:20px 22px;border-radius:24px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px)}
.m-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:var(--sans);font-weight:300;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.m-head .lost{color:var(--bad)}
.m-q{font-family:var(--display);font-size:clamp(17px,1.7vw,22px);line-height:1.4;margin-bottom:14px}
.ans-row{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:10px 0;border-top:1px solid var(--line);font-size:clamp(16px,1.4vw,19px);line-height:1.45;font-weight:500}
.ans-row .lab{font-family:var(--sans);font-weight:300;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding-top:5px;white-space:nowrap}
.ans-row.you .lab{color:var(--bad)} .ans-row.right .lab{color:var(--ok)}
.perfect{padding:34px;text-align:center;font-family:var(--display);font-size:clamp(20px,2.4vw,30px);border:1px solid var(--line);border-radius:24px;background:var(--glass)}

@media (max-width:820px){
  .nav-links button:nth-child(n+3){display:none}
  .tag{top:24%;right:var(--pad);font-size:10px}
  .about{display:none}
  .home-foot{align-items:flex-start}
  .quiz{grid-template-columns:1fr;align-items:start}
  .q-left{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px 18px}
  .topic{grid-column:1/-1;min-height:0}
  .counter{margin:0}
  .counter .num{font-size:72px}
  .weight{justify-self:end}
  .fields{grid-template-columns:1fr}
  .res-top{grid-template-columns:1fr;justify-items:start}
  .pill{padding:10px 14px}
}
@media (max-width:480px){
  .nav-links{display:none}
  .circle{width:48px;height:48px}
  .next-pill{height:48px;padding:0 20px}
  .opt{grid-template-columns:36px 1fr;gap:12px;padding:14px 16px 14px 12px;border-radius:18px}
  .opt .ltr{width:36px;height:36px;font-size:15px}
  .tick{width:18px}.tick.cur{width:30px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body data-screen="home">

<canvas id="burst" aria-hidden="true"></canvas>
<canvas id="flower" aria-hidden="true"></canvas>

<header class="nav">
  <nav class="nav-links" aria-label="Asosiy menyu">
    <button data-go="home">Bosh sahifa</button>
    <button data-go="name">Testlar<sup>15</sup></button>
    <button data-go="home">Fan haqida</button>
    <button data-go="home">M.Bekali</button>
  </nav>
  <span class="pill" id="navName" aria-live="polite"></span>
  <button class="pill" id="navCta" data-go="name">
    Testni boshlash
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 10 10 2M4 2h6v6"/></svg>
  </button>
</header>

<!-- HOME -->
<section class="screen on" id="s-home" aria-label="Bosh sahifa">
  <h1 class="title t1">Ma’muriy</h1>
  <div class="title t2" aria-hidden="true">huquq</div>
  <p class="tag">Fan bo‘yicha<br>15 ta murakkab<br>test</p>
  <div class="home-foot">
    <div>
      <div class="author"><small>Muallif</small>© M.Bekali</div>
      <button class="cta" data-go="name">Testni boshlash
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 10 10 2M4 2h6v6"/></svg>
      </button>
    </div>
    <p class="about">Ma’muriy huquq fanidan bilimingizni sinab ko‘ring. Har bir savolning o‘z bali bor, natijada foiz va xatolaringiz ko‘rsatiladi.</p>
  </div>
</section>

<!-- NAME -->
<section class="screen" id="s-name" aria-label="Ism va familiya" aria-hidden="true">
  <form class="name-wrap" id="nameForm" novalidate>
    <h2 class="h2">Ism va familiyangizni yozing</h2>
    <div class="fields">
      <div class="field"><label for="fName">Ism</label><input id="fName" autocomplete="given-name" maxlength="40" placeholder="Ismingiz"></div>
      <div class="field"><label for="fSurname">Familiya</label><input id="fSurname" autocomplete="family-name" maxlength="40" placeholder="Familiyangiz"></div>
    </div>
    <div class="meta" id="metaRow"></div>
    <div class="err" id="nameErr" role="alert"></div>
    <button class="big-btn" type="submit">Testni boshlash
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 10 10 2M4 2h6v6"/></svg>
    </button>
  </form>
</section>

<!-- QUIZ -->
<section class="screen" id="s-quiz" aria-label="Test" aria-hidden="true">
  <div class="quiz">
    <div class="q-left">
      <div class="topic" id="qTopic"></div>
      <div class="counter" aria-label="Savol raqami"><span class="plus">+</span><span class="num" id="qNum">01</span><span class="of" id="qOf">/ 15</span></div>
      <div class="weight">Ball <b id="qW">1.0</b></div>
    </div>
    <div class="q-right" id="qRight">
      <h2 class="qtext" id="qText"></h2>
      <div class="opts" id="qOpts" role="radiogroup" aria-labelledby="qText"></div>
    </div>
  </div>
  <div class="q-foot">
    <div class="warn" id="qWarn" role="status"></div>
    <div class="ticks" id="qTicks" aria-label="Savollar"></div>
    <div class="ctrl">
      <button class="circle" id="bPrev" aria-label="Oldingi savol"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M11 3 5 9l6 6"/></svg></button>
      <button class="next-pill" id="bNext"><span id="bNextT">Keyingisi</span><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M7 3l6 6-6 6"/></svg></button>
    </div>
  </div>
</section>

<!-- RESULT -->
<section class="screen" id="s-result" aria-label="Natija" aria-hidden="true">
  <div class="res">
    <div class="res-top">
      <div class="ring">
        <svg viewBox="0 0 220 220">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9be8"/><stop offset="1" stop-color="#7b4dff"/></linearGradient></defs>
          <circle class="bg" cx="110" cy="110" r="96" fill="none" stroke-width="7"/>
          <circle class="fg" id="ringFg" cx="110" cy="110" r="96" fill="none" stroke-width="7" stroke-dasharray="603.19" stroke-dashoffset="603.19"/>
        </svg>
        <div class="pct"><div><span id="pctNum" style="font-size:1em;margin:0;color:inherit">0</span><span>%</span></div></div>
      </div>
      <div>
        <div class="who" id="rWho"></div>
        <div class="verdict" id="rVerdict"></div>
        <div class="stats" id="rStats"></div>
      </div>
    </div>

<script>
/* ============ SOZLAMALAR ============
   Har bir savolning bali "w" maydonida. O‘zgartirish mumkin (masalan 1.2, 1.4, 2.0).
   "c" — to‘g‘ri javob indeksi: 0=A, 1=B, 2=C, 3=D
*/
const Q = [
{ t:`Ma’muriy huquq tushunchasi`, w:1.0, c:2,
  q:`Ma’muriy huquq tushunchasining eng to‘liq va aniq ifodasini aniqlang.`,
  o:[
  `Ma’muriy huquq — davlat hokimiyatini amalga oshirish jarayonida yuzaga keladigan barcha ijtimoiy munosabatlarni, shu jumladan qonun chiqaruvchi va sud hokimiyati faoliyatini tartibga soluvchi huquq tarmog‘idir.`,
  `Ma’muriy huquq — faqat ijro etuvchi hokimiyat organlarining ichki faoliyati va ular o‘rtasidagi xizmat munosabatlarini tartibga soluvchi huquq tarmog‘idir.`,
  `Ma’muriy huquq — davlatning vazifalari va funksiyalarini amalga oshirish jarayonida, ayniqsa ijro etuvchi hokimiyat, davlat boshqaruvi va mahalliy o‘zini o‘zi boshqarish sohalarida vujudga keladigan munosabatlarni tartibga soluvchi huquq tarmog‘idir.`,
  `Ma’muriy huquq — davlat organlari bilan fuqarolar o‘rtasida yuzaga keladigan barcha munosabatlarni, ularning mazmunidan qat’i nazar, tartibga soluvchi huquq sohasi hisoblanadi.`]},
{ t:`Ma’muriy huquqning ommaviy huquqdagi o‘rni`, w:1.2, c:0,
  q:`Ma’muriy huquqning ommaviy huquq tizimidagi o‘rnini eng aniq ifodalovchi javobni aniqlang.`,
  o:[
  `Ma’muriy huquq ommaviy huquqning tarkibiy qismi bo‘lib, uning asosiy predmeti davlat boshqaruvi va ijro etuvchi hokimiyat faoliyati bilan bog‘liq munosabatlarni huquqiy tartibga solishdan iborat; parlament va sudlarning hokimiyat vakolatlarini amalga oshirish faoliyati esa uning asosiy predmetiga kirmaydi.`,
  `Ma’muriy huquq davlat hokimiyatining barcha tarmoqlari — qonun chiqaruvchi, ijro etuvchi va sud hokimiyatining vakolatlarini amalga oshirish bilan bog‘liq barcha munosabatlarni kompleks ravishda tartibga soladi.`,
  `Ma’muriy huquq ommaviy huquq tarkibida faqat davlat organlarining ichki faoliyatini tartibga soladi, fuqarolar bilan munosabatlar esa faqat fuqarolik huquqiga tegishlidir.`,
  `Ma’muriy huquq faqat ijro etuvchi hokimiyat organlarining vakolatlarini belgilaydi va davlat boshqaruvi jarayonidagi boshqa munosabatlarni tartibga solmaydi.`]},
{ t:`Ma’muriy huquqning o‘ziga xos xususiyati va tizimi`, w:1.4, c:3,
  q:`Quyidagi fikrlardan qaysi biri ma’muriy huquqning o‘ziga xos xususiyati hamda uning Umumiy va Maxsus qismlarga bo‘linishini bir vaqtning o‘zida eng to‘g‘ri ifodalaydi?`,
  o:[
  `Ma’muriy huquq boshqa huquq sohalarida belgilangan majburiyatlarning mazmunini belgilaydi; Umumiy qismda davlat boshqaruvining alohida sohalari, Maxsus qismda esa ma’muriy huquqning prinsiplari o‘rganiladi.`,
  `Ma’muriy huquq boshqa huquq sohalaridan mustaqil ravishda barcha huquqiy majburiyatlarning mazmuni va bajarilish tartibini belgilaydi; Umumiy qism alohida boshqaruv tarmoqlarini, Maxsus qism esa umumiy prinsiplarni qamrab oladi.`,
  `Ma’muriy huquq faqat ijro etuvchi hokimiyat organlarining ichki faoliyatini belgilaydi; Umumiy qismda davlat xizmati va ma’muriy protsess, Maxsus qismda esa ma’muriy huquqning predmeti va subyektlari o‘rganiladi.`,
  `Ma’muriy huquq ko‘pincha boshqa huquq sohalarida belgilangan talablarning kim tomonidan, qaysi organ orqali va qanday tartibda amalga oshirilishini tartibga soladi; Umumiy qismda umumiy institutlar, Maxsus qismda esa boshqaruvning alohida sohalari va maxsus yo‘nalishlari o‘rganiladi.`]},
{ t:`Ma’muriy huquqning belgilari, usuli va predmeti`, w:1.2, c:1,
  q:`Quyidagi vaziyatlardan qaysi biri ma’muriy huquqning asosiy belgilari, imperativ usuli va predmetini birgalikda eng to‘g‘ri aks ettiradi?`,
  o:[
  `Ikki tadbirkor o‘rtasidagi shartnomada bir tomon ikkinchisidan majburiyatni bajarishni talab qilgani sababli ushbu munosabat ma’muriy huquqning imperativ usuliga asoslanadi.`,
  `Vakolatli ma’muriy organ qonunda belgilangan asoslar mavjud bo‘lganda shaxsga ruxsat beradi, qonun talablariga rioya etilishini nazorat qiladi va zarur hollarda qonuniy majburiy choralarni qo‘llaydi. Bunda davlat boshqaruvi vakolatiga ega organ ishtirok etishi va hokimiy vakolatlarning amalga oshirilishi ma’muriy huquqning muhim belgilarini ifodalaydi.`,
  `Ma’muriy huquqning predmeti faqat ijro etuvchi hokimiyat organlarining ichki xizmat munosabatlaridan iborat bo‘lib, fuqarolar va tashkilotlarning ma’muriy organlar bilan munosabatlari unga kirmaydi.`,
  `Ma’muriy huquqda asosiy usul dispozitiv usul bo‘lib, davlat organlari fuqarolar bilan munosabatlarda hokimiy vakolatlarga ega emas.`]},
{ t:`Ma’muriy-huquqiy munosabatlarning turlari va elementlari`, w:1.6, c:3,
  q:`Quyidagi fikrlardan qaysi biri ma’muriy-huquqiy munosabatlarning turlari va elementlarini eng to‘g‘ri ifodalaydi?`,
  o:[
  `Vertikal munosabatlarda tomonlar bir-biriga bo‘ysunmaydi; gorizontal munosabatlarda esa yuqori turuvchi organ quyi organga majburiy ko‘rsatma berishi mumkin. Yuridik fakt faqat voqea shaklida mavjud bo‘ladi.`,
  `Protsessual munosabatlar ma’muriy huquqdagi huquq va majburiyatlarning mazmunini belgilaydi, moddiy munosabatlar esa faqat ishni ko‘rib chiqish tartibini belgilaydi.`,
  `Ma’muriy-huquqiy munosabat faqat davlat organlari o‘rtasida vujudga keladi; fuqaro va tashkilotlar uning subyekti bo‘la olmaydi. Yuridik fakt esa faqat ma’muriy organ qaroridan iborat.`,
  `Vertikal munosabatlarda bo‘ysunish mavjud bo‘ladi, gorizontal munosabatlarda esa tomonlar o‘zaro bo‘ysunmaydi; moddiy munosabatlar huquq va majburiyatlarning mazmuni bilan, protsessual munosabatlar esa ularni amalga oshirish va ishni hal qilish tartibi bilan bog‘liq. Munosabatning asosiy elementlari subyekt, obyekt va yuridik fakt hisoblanadi.`]},
{ t:`Ma’muriy nizolar, nazorat va konstitutsiyaviy asoslar`, w:1.8, c:2,
  q:`Quyidagi holatlarning qaysi birida ma’muriy nizolar, nazorat munosabatlari va ma’muriy huquqning konstitutsiyaviy asoslari o‘rtasidagi bog‘liqlik eng to‘g‘ri ifodalangan?`,
  o:[
  `Davlat organining unga bo‘ysunmaydigan tashkilot faoliyatini tekshirishi ichki nazorat hisoblanadi. Ma’muriy nizolar esa faqat tegishli ma’muriy organ tomonidan ko‘rilib, sudda ko‘rib chiqilishi mumkin emas.`,
  `Rahbarning o‘z tizimidagi xodim faoliyatini nazorat qilishi tashqi nazorat, davlat organining unga bo‘ysunmaydigan tashkilot faoliyatini tekshirishi esa ichki nazorat hisoblanadi.`,
  `Rahbarning o‘z tizimidagi xodimlar faoliyatini nazorat qilishi ichki nazoratga, davlat organining unga bevosita bo‘ysunmaydigan shaxs yoki tashkilot faoliyatini nazorat qilishi esa tashqi nazoratga misol bo‘lishi mumkin. Ma’muriy nizo ma’muriy tartibda, qonunda nazarda tutilgan hollarda esa sudda ko‘rilishi mumkin; bunda tenglik, murojaat qilish huquqi va mutanosiblik kabi konstitutsiyaviy talablar muhimdir.`,
  `Ma’muriy nizolar faqat davlat organlari o‘rtasida yuzaga keladi va fuqarolarning davlat organlariga ariza yoki shikoyat bilan murojaat qilish huquqi ma’muriy huquq bilan bog‘liq emas.`]},
{ t:`Davlat boshqaruvi funksiyalari va ma’muriy huquq prinsiplari`, w:1.4, c:0,
  q:`Quyidagi vaziyatlardan qaysi birida davlat boshqaruvi funksiyasi va ma’muriy huquqning maxsus prinsiplari eng to‘g‘ri qo‘llangan?`,
  o:[
  `Ma’muriy organ qonuniy maqsadga erishish uchun mavjud choralar ichidan shaxs huquqlariga eng kam ortiqcha cheklov keltiradigan chorani tanlaydi, qaror qabul qilishdan oldin manfaatdor shaxsga fikr bildirish imkonini beradi va qonunda nazarda tutilmagan hujjatlarni talab qilmaydi.`,
  `Ma’muriy organ diskretsion vakolatga ega bo‘lganligi sababli qonunda belgilangan maqsaddan tashqari maqsadlarni ko‘zlab, o‘zi ma’qul deb topgan istalgan chorani qo‘llashi mumkin.`,
  `Tenglik prinsipi bir xil holatda bo‘lgan shaxslarga ham turlicha munosabatda bo‘lish imkonini beradi, agar bu davlat organining ma’muriy qarori bilan asoslantirilgan bo‘lsa.`,
  `Mutanosiblik prinsipi davlat organidan har qanday vaziyatda mavjud bo‘lgan eng og‘ir chorani qo‘llashni talab qiladi, chunki davlat manfaatlari shaxs manfaatlaridan doimo ustun turadi.`]},
{ t:`Manbalar, jinoyat huquqi bilan bog‘liqligi va tarixiy rivojlanishi`, w:2.0, c:3,
  q:`Quyidagi variantlardan qaysi biri ma’muriy huquqning manbalari, jinoyat huquqi bilan bog‘liqligi va tarixiy rivojlanishini eng to‘liq va mantiqan to‘g‘ri aks ettiradi?`,
  o:[
  `Ma’muriy huquqning manbalari faqat Konstitutsiya va qonunlardan iborat. Prezident va Vazirlar Mahkamasi hujjatlari ma’muriy huquq manbasi hisoblanmaydi. Ma’muriy huquq jinoyat huquqidan mustaqil ravishda shakllangan.`,
  `Mahalliy davlat hokimiyati organlarining qarorlari ma’muriy huquq manbalari tizimida eng yuqori yuridik kuchga ega. Ma’muriy huquq faqat Germaniya nazariyasi asosida shakllangan va Fransiyadagi ma’muriy sudlov uning rivojiga ta’sir ko‘rsatmagan.`,
  `Prezident farmonlari va qarorlari qonunlardan yuqori yuridik kuchga ega. Jinoyat tarkibi mavjud bo‘lgan har qanday qilmish dastlab ma’muriy huquq asosida ko‘rilishi shart.`,
  `Ma’muriy huquq manbalari yuridik kuchiga ko‘ra Konstitutsiya, qonunlar hamda tegishli qonunosti hujjatlarini o‘z ichiga oladi; ma’muriy va jinoyat huquqini farqlashda tegishli qilmishning huquqiy tarkibi va javobgarlik asoslari muhim; ma’muriy huquq tarixan politsiya huquqidan ajralib rivojlangan, Fransiyada ma’muriy boshqaruv va ma’muriy sudlov, Germaniyada esa ma’muriy huquq nazariyasi rivojlangan.`]},
{ t:`Boshqa huquq sohalari bilan bog‘liqlik`, w:1.2, c:0,
  q:`Quyidagi holatlardan qaysi biri ma’muriy huquqning boshqa huquq sohalari normalarini amalga oshirish tartibini belgilash xususiyatini eng aniq ifodalaydi?`,
  o:[
  `Soliq huquqi soliq to‘lash majburiyatini belgilaydi, ma’muriy huquq esa soliq organining hisobga olish, tekshirish va nazorat qilish faoliyatini tartibga solishi mumkin.`,
  `Soliq huquqi soliq organining barcha vakolatlarini belgilaydi, ma’muriy huquq esa faqat fuqaroning soliq to‘lash majburiyatini belgilaydi.`,
  `Ma’muriy huquq boshqa huquq sohalarida belgilangan barcha huquq va majburiyatlarni o‘zining normalari bilan almashtiradi va ularning mazmunini mustaqil ravishda belgilaydi.`,
  `Soliq to‘lash bilan bog‘liq har qanday munosabat faqat ma’muriy huquq bilan tartibga solinadi, soliq huquqining bunday munosabatlarda mustaqil ahamiyati mavjud emas.`]},
{ t:`Umumiy va Maxsus qism`, w:1.4, c:2,
  q:`Quyidagi variantlardan qaysi birida ma’muriy huquqning Umumiy va Maxsus qismlariga oid institutlar to‘g‘ri ajratilgan?`,
  o:[
  `Umumiy qism — davlat xizmati va ma’muriy protsessni, Maxsus qism — ma’muriy huquq tushunchasi va uning prinsiplarini o‘rganadi.`,
  `Umumiy qism — faqat davlat boshqaruvining alohida tarmoqlarini, Maxsus qism — ma’muriy-huquqiy munosabatlarning umumiy nazariyasini o‘rganadi.`,
  `Umumiy qismda ma’muriy huquqning predmeti, subyektlari, manbalari, prinsiplari va boshqaruv shakl-usullari kabi umumiy institutlar; Maxsus qismda esa davlat boshqaruvining alohida sohalari, davlat xizmati, ma’muriy tartib-taomillar va ma’muriy protsess kabi yo‘nalishlar o‘rganiladi.`,
  `Umumiy va Maxsus qismlar o‘rtasida mazmuniy farq mavjud emas, ular bir xil ma’muriy-huquqiy institutlarni turli nomlar bilan o‘rganadi.`]},
{ t:`Ma’muriy huquq usullari`, w:1.0, c:1,
  q:`Quyidagi vaziyatlardan qaysi birida ma’muriy huquqning ruxsat berish, majburiyat yuklash va taqiqlash usullari eng to‘liq aks ettirilgan?`,
  o:[
  `Ma’muriy organ fuqaroning faoliyatini rag‘batlantiradi, unga tavsiya beradi va tomonlar o‘zaro kelishuv asosida harakat qiladi. Bu holatda imperativ usulning uch shakli bir vaqtning o‘zida namoyon bo‘ladi.`,
  `Vakolatli organ qonunda belgilangan shartlarga rioya qilgan shaxsga faoliyat yuritishga imkon beradi, qonunda belgilangan majburiyatni bajarishni talab qiladi va muayyan xavfli harakatni amalga oshirishni qonun bilan taqiqlaydi.`,
  `Ruxsat berish faqat davlat organlariga nisbatan qo‘llanadi, majburiyat yuklash faqat fuqarolarga, taqiqlash esa faqat tashkilotlarga nisbatan qo‘llanadi.`,
  `Ruxsat berish va taqiqlash fuqarolik huquqiga, majburiyat yuklash esa faqat jinoyat huquqiga xos bo‘lib, ular ma’muriy huquqning usullari hisoblanmaydi.`]},
{ t:`Yuridik fakt`, w:1.2, c:2,
  q:`Quyidagi holatlardan qaysi birida ma’muriy-huquqiy munosabatning yuridik faktini aniqlash eng to‘g‘ri amalga oshirilgan?`,
  o:[
  `Fuqaro ma’muriy organga ariza bilan murojaat qiladi va ushbu ariza munosabatning subyekti hisoblanadi.`,
  `Ma’muriy organ va fuqaro o‘rtasidagi munosabatning o‘zi yuridik fakt hisoblanadi, chunki u davlat boshqaruvi sohasida yuzaga kelgan.`,
  `Fuqaroning davlat organiga murojaat qilishi yoki qonuniy ahamiyatga ega boshqa harakatni amalga oshirishi huquqiy munosabatning yuzaga kelishiga sabab bo‘lishi mumkin; bunday harakat yuridik fakt sifatida baholanishi mumkin.`,
  `Yuridik fakt faqat tabiiy voqea-hodisa bo‘lishi mumkin, insonning harakati yoki harakatsizligi hech qachon yuridik fakt bo‘la olmaydi.`]},
{ t:`Ishonchlilik va tinglanish imkoniyati`, w:1.6, c:0,
  q:`Quyidagi vaziyatlardan qaysi biri “ishonchlilik” va “tinglanish imkoniyati” prinsiplarini birgalikda to‘g‘ri aks ettiradi?`,
  o:[
  `Ma’muriy organ shaxs taqdim etgan ma’lumotni aksi isbotlanmaguncha ishonchli deb qabul qiladi, zarur bo‘lsa uni o‘z hisobidan tekshiradi va qaror qabul qilishdan oldin manfaatdor shaxsga o‘z fikrini bildirish imkoniyatini beradi.`,
  `Ma’muriy organ shaxs taqdim etgan har qanday ma’lumotni oldindan ishonchsiz deb hisoblaydi va qaror qabul qilingandan keyingina shaxsga o‘z fikrini bildirish imkoniyatini beradi.`,
  `Ishonchlilik prinsipi ma’muriy organning shaxsdan istalgan miqdorda qo‘shimcha hujjat talab qilishini, tinglanish prinsipi esa qaror qabul qilingandan keyin shaxsning e’tiroz bildirishini anglatadi.`,
  `Shaxs bergan ma’lumotlar faqat sud tomonidan tekshirilishi mumkin; ma’muriy organ esa qaror qabul qilishdan oldin manfaatdor shaxsni tinglashi shart emas.`]},
{ t:`Huquqlar ustunligi va tenglik`, w:1.8, c:3,
  q:`Quyidagi vaziyatlardan qaysi birida “manfaatdor shaxs huquqlarining ustunligi” va “tenglik” prinsiplari o‘z mazmuniga eng yaqin tarzda ifodalangan?`,
  o:[
  `Bir xil vaziyatdagi shaxslarga davlat organi o‘z xohishiga ko‘ra turlicha munosabatda bo‘lishi mumkin, agar qaror davlat manfaatlariga mos deb hisoblansa.`,
  `Ma’muriy organ barcha noaniqliklarni avtomatik ravishda davlat foydasiga talqin qilishi va bir xil holatdagi shaxslarga turlicha talablar qo‘yishi mumkin.`,
  `Manfaatdor shaxs huquqlarining ustunligi faqat sud jarayonlariga tegishli bo‘lib, ma’muriy organ faoliyatida qo‘llanilmaydi; tenglik esa barcha shaxslarga mutlaqo bir xil qaror chiqarishni anglatadi.`,
  `Bartaraf etib bo‘lmaydigan noaniqlik va qarama-qarshiliklar tegishli shartlarda manfaatdor shaxs foydasiga talqin qilinishi, bir xil holatdagi shaxslarga esa asossiz ravishda turlicha munosabatda bo‘lmaslik talab etiladi.`]},
{ t:`Manbalar va ularning yuridik kuchi`, w:2.0, c:0,
  q:`Quyidagi variantlardan qaysi biri ma’muriy huquqning manbalari va ularning yuridik kuchi bo‘yicha berilgan ketma-ketlikni eng to‘g‘ri aks ettiradi?`,
  o:[
  `Konstitutsiya → qonun → Prezident hujjatlari → Vazirlar Mahkamasi qarorlari → vazirlik va idoralar hujjatlari → mahalliy davlat hokimiyati organlari qarorlari.`,
  `Prezident farmonlari → Konstitutsiya → qonunlar → Vazirlar Mahkamasi qarorlari → mahalliy davlat hokimiyati qarorlari.`,
  `Konstitutsiya → Prezident farmonlari → qonunlar → vazirliklar buyruqlari → Vazirlar Mahkamasi qarorlari → mahalliy hokimiyat qarorlari.`,
  `Qonunlar → Konstitutsiya → Prezident qarorlari → mahalliy hokimiyat qarorlari → Vazirlar Mahkamasi qarorlari → vazirliklar buyruqlari.`]}
];

const LET = ['A','B','C','D'];
const N = Q.length;
const r2 = x => Math.round(x*100)/100;
const fmt = x => { const v = Math.round(x*10)/10; return Number.isInteger(v) ? v.toFixed(1) : String(v); };
const TOTAL = r2(Q.reduce((s,q)=>s+q.w,0));
const pad = n => String(n).padStart(2,'0');
const $ = s => document.querySelector(s);
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ HOLAT ============ */
const st = { name:'', surname:'', i:0, ans:Array(N).fill(-1), warned:false, result:null };
const screens = { home:$('#s-home'), name:$('#s-name'), quiz:$('#s-quiz'), result:$('#s-result') };
const INTENSITY = { home:.12, name:.3, quiz:.42, result:.9 };
let cur = 'home';

function go(n){
  cur = n;
  for (const [k,el] of Object.entries(screens)){
    const on = k===n;
    el.classList.toggle('on', on);
    el.setAttribute('aria-hidden', String(!on));
    el.inert = !on;
  }
  document.body.dataset.screen = n;
  screens[n].scrollTop = 0;
  burst.target = INTENSITY[n];
  burst.kick = Math.max(burst.kick, .5);
  if (n==='name') setTimeout(()=>$('#fName').focus(), 600);
}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));

/* ============ ISM-FAMILIYA ============ */
$('#metaRow').innerHTML =
  `<span><b>${N}</b>ta savol</span><span><b>${fmt(TOTAL)}</b>jami ball</span><span><b>∞</b>vaqt cheklanmagan</span>`;

$('#nameForm').addEventListener('submit', e=>{
  e.preventDefault();
  const a = $('#fName').value.trim().replace(/\s+/g,' ');
  const b = $('#fSurname').value.trim().replace(/\s+/g,' ');
  const err = $('#nameErr');
  if (a.length<2 || b.length<2){
    err.textContent = 'Ism va familiyani to‘liq yozing (kamida 2 ta harf).';
    (a.length<2 ? $('#fName') : $('#fSurname')).focus();
    return;
  }
  err.textContent = '';
  st.name=a; st.surname=b; st.i=0; st.ans=Array(N).fill(-1); st.warned=false;
  $('#navName').textContent = `${a} ${b}`;
  buildTicks(); renderQ(false); go('quiz');
});

/* ============ TEST ============ */
function buildTicks(){
  const box = $('#qTicks'); box.innerHTML='';
  for (let k=0;k<N;k++){
    const t = document.createElement('button');
    t.className='tick'; t.type='button';
    t.setAttribute('aria-label',`${k+1}-savol`);
    t.addEventListener('click',()=>jump(k));
    box.appendChild(t);
  }
}
function paintTicks(){
  [...$('#qTicks').children].forEach((t,k)=>{
    t.classList.toggle('cur',k===st.i);
    t.classList.toggle('ans',st.ans[k]>=0 && k!==st.i);
  });
}
function fillQ(){
  const q = Q[st.i];
  $('#qTopic').textContent = q.t;
  $('#qNum').textContent = pad(st.i+1);
  $('#qOf').textContent = `/ ${N}`;
  $('#qW').textContent = fmt(q.w);
  $('#qText').textContent = q.q;
  const box = $('#qOpts'); box.innerHTML='';
  q.o.forEach((txt,k)=>{
    const b = document.createElement('button');
    b.type='button'; b.className='opt'+(st.ans[st.i]===k?' sel':'');
    b.setAttribute('role','radio'); b.setAttribute('aria-checked',String(st.ans[st.i]===k));
    const l = document.createElement('span'); l.className='ltr'; l.textContent=LET[k];
    const t = document.createElement('span'); t.textContent=txt;
    b.append(l,t);
    b.addEventListener('click',()=>choose(k));
    box.appendChild(b);
  });
  $('#bPrev').disabled = st.i===0;
  $('#bNextT').textContent = st.i===N-1 ? 'Yakunlash' : 'Keyingisi';
  paintTicks();
}
function renderQ(anim=true){
  const r = $('#qRight');
  $('#qWarn').textContent='';
  if (!anim || RM){ fillQ(); return; }
  r.classList.add('out');
  setTimeout(()=>{ fillQ(); r.classList.remove('out'); burst.kick = Math.max(burst.kick,.6); }, 240);
}
function choose(k){
  st.ans[st.i]=k; st.warned=false; $('#qWarn').textContent='';
  [...$('#qOpts').children].forEach((b,j)=>{
    b.classList.toggle('sel',j===k); b.setAttribute('aria-checked',String(j===k));
  });
  paintTicks();
  burst.kick = 1.1;
}
function jump(k){ if(k===st.i) return; st.i=k; renderQ(true); }
function next(){
  if (st.i<N-1){ st.i++; renderQ(true); return; }
  const un = st.ans.filter(a=>a<0).length;
  if (un>0 && !st.warned){
    st.warned=true;
    $('#qWarn').textContent = `${un} ta savolga javob berilmagan. Yakunlash tugmasini yana bosing — ular xato hisoblanadi.`;
    return;
  }
  finish();
}
function prev(){ if(st.i>0){ st.i--; renderQ(true);} }
$('#bNext').addEventListener('click',next);
$('#bPrev').addEventListener('click',prev);

document.addEventListener('keydown',e=>{
  if (cur!=='quiz') return;
  const k = e.key.toLowerCase();
  if ('abcd'.includes(k) && k.length===1) choose('abcd'.indexOf(k));
  else if (['1','2','3','4'].includes(k)) choose(Number(k)-1);
  else if (k==='enter'||k==='arrowright') { e.preventDefault(); next(); }
  else if (k==='arrowleft') prev();
});

/* ============ NATIJA ============ */
function finish(){
  let earned=0, right=0; const mist=[];
  Q.forEach((q,k)=>{
    if (st.ans[k]===q.c){ earned+=q.w; right++; }
    else mist.push(k);
  });
  earned=r2(earned);
  const pct = Math.round(earned/TOTAL*1000)/10;
  st.result = { earned, right, pct, mist };
  renderResult();
  go('result');
}
function verdictOf(p){
  if (p>=86) return 'A’lo natija';
  if (p>=71) return 'Yaxshi natija';
  if (p>=56) return 'Qoniqarli natija';
  return 'Yana mashq qiling';
}
function renderResult(){
  const R = st.result;
  $('#rWho').textContent = `${st.name} ${st.surname}`;
  $('#rVerdict').textContent = verdictOf(R.pct);
  const wrong = N-R.right;
  $('#rStats').innerHTML = '';
  [
    ['ok', `${R.right} / ${N}`, 'To‘g‘ri javob'],
    ['no', String(wrong), 'Xato yoki javobsiz'],
    ['', `${fmt(R.earned)} / ${fmt(TOTAL)}`, 'To‘plangan ball']
  ].forEach(([c,v,l])=>{
    const d=document.createElement('div'); d.className='stat '+c;
    const b=document.createElement('b'); b.textContent=v;
    const s=document.createElement('span'); s.textContent=l;
    d.append(b,s); $('#rStats').appendChild(d);
  });
  // halqa va sanash animatsiyasi
  const ring=$('#ringFg'), C=603.19;
  ring.style.strokeDashoffset=C;
  const num=$('#pctNum'); num.textContent='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ ring.style.strokeDashoffset = C*(1-R.pct/100); }));
  const t0=performance.now(), dur=RM?1:1600;
  (function tick(now){
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
    num.textContent = (Math.round(R.pct*e*10)/10).toString();
    if(p<1) requestAnimationFrame(tick); else num.textContent=String(R.pct);
  })(t0);
  // xatolar
  const box=$('#rMist'); box.innerHTML='';
  if (!R.mist.length){
    $('#rSub').textContent='';
    const d=document.createElement('div'); d.className='perfect'; d.textContent='Xato yo‘q. Barcha savollarga to‘g‘ri javob berdingiz.';
    box.appendChild(d); return;
  }
  $('#rSub').textContent = `${R.mist.length} ta savolda xatoga yo‘l qo‘yildi. Har birida sizning javobingiz va to‘g‘ri javob ko‘rsatilgan.`;
  R.mist.forEach(k=>{
    const q=Q[k], a=st.ans[k];
    const card=document.createElement('article'); card.className='m';
    const head=document.createElement('div'); head.className='m-head';
    const h1=document.createElement('span'); h1.textContent=`${k+1}-savol · ${q.t}`;
    const h2=document.createElement('span'); h2.className='lost'; h2.textContent=`−${fmt(q.w)} ball`;
    head.append(h1,h2);
    const qq=document.createElement('div'); qq.className='m-q'; qq.textContent=q.q;
    const row=(cls,lab,txt)=>{
      const r=document.createElement('div'); r.className='ans-row '+cls;
      const l=document.createElement('span'); l.className='lab'; l.textContent=lab;
      const t=document.createElement('span'); t.textContent=txt;
      r.append(l,t); return r;
    };
    card.append(head,qq,
      row('you','Sizning javob', a<0 ? 'Javob belgilanmagan' : `${LET[a]}) ${q.o[a]}`),
      row('right','To‘g‘ri javob', `${LET[q.c]}) ${q.o[q.c]}`));
    box.appendChild(card);
  });
}
$('#bAgain').addEventListener('click',()=>{
  $('#fName').value=st.name; $('#fSurname').value=st.surname; go('name');
});
$('#bCopy').addEventListener('click',async()=>{
  const R=st.result; if(!R) return;
  const lines=[
    `Ma’muriy huquq — test natijasi`,
    `Ism-familiya: ${st.name} ${st.surname}`,
    `Natija: ${R.pct}% (${fmt(R.earned)} / ${fmt(TOTAL)} ball)`,
    `To‘g‘ri javoblar: ${R.right} / ${N}`,
    R.mist.length ? `Xato savollar: ${R.mist.map(k=>k+1).join(', ')}` : `Xato yo‘q`
  ].join('\n');
  const btn=$('#bCopy'), old=btn.textContent;
  try{ await navigator.clipboard.writeText(lines); btn.textContent='Nusxalandi'; }
  catch(_){
    const ta=document.createElement('textarea'); ta.value=lines; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); btn.textContent='Nusxalandi'; }catch(__){ btn.textContent='Nusxalab bo‘lmadi'; }
    ta.remove();
  }
  setTimeout(()=>btn.textContent=old,1800);
});

/* ============ FON: BINAFSHA PORTLASH ============ */
const burst = { I:.12, target:.12, kick:0 };
(function(){
  const c=$('#burst'), ctx=c.getContext('2d');
  let W=0,H=0,dpr=1;
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  size(); window.addEventListener('resize',size);
  const P=Array.from({length:340},()=>({ph:Math.random(),sp:.035+Math.random()*.09,l:.08+Math.random()*.34,w:.5+Math.random()*1.8,a:Math.random()*Math.PI*2,k:Math.random()}));
  function frame(ts){
    const t=ts/1000;
    burst.I += (burst.target+burst.kick-burst.I)*.045; burst.kick*=.93;
    const I=Math.min(1.4,burst.I);
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    const cx=W*.5, cy=H*.52, maxR=Math.hypot(W,H)*(.2+.22*Math.min(1,I));
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,maxR*.95);
    g.addColorStop(0,`rgba(190,120,255,${.34*I})`);
    g.addColorStop(.5,`rgba(120,60,230,${.16*I})`);
    g.addColorStop(1,'rgba(60,20,140,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const sp = RM ? .08 : 1;
    for(const p of P){
      const pr=(p.ph+t*p.sp*sp)%1;
      const d=maxR*(.05+pr*.95), d2=d+maxR*p.l*(.35+pr);
      const al=Math.pow(1-pr,1.4)*I*.9;
      if(al<.01) continue;
      const cs=Math.cos(p.a), sn=Math.sin(p.a);
      ctx.strokeStyle=`rgba(${p.k<.55?'205,150,255':'255,165,235'},${al})`;
      ctx.lineWidth=p.w*(1-pr*.5);
      ctx.beginPath(); ctx.moveTo(cx+cs*d,cy+sn*d); ctx.lineTo(cx+cs*d2,cy+sn*d2); ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ============ BOSH SAHIFA: SHISHASIMON 3D GUL ============ */
(function(){
  const c=$('#flower'), ctx=c.getContext('2d');
  let W=0,H=0,dpr=1,mx=0,my=0,smx=0,smy=0;
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  size(); window.addEventListener('resize',size);
  window.addEventListener('pointermove',e=>{ mx=e.clientX/W-.5; my=e.clientY/H-.5; });
  const layers=[
    {n:14,len:1.0,w:.22,open:.28,bend:.30},
    {n:12,len:.84,w:.20,open:.72,bend:.32},
    {n:9, len:.64,w:.21,open:1.15,bend:.36},
    {n:7, len:.42,w:.26,open:1.60,bend:.40}
  ];
  const petals=[];
  layers.forEach((L,li)=>{
    for(let i=0;i<L.n;i++){
      const ang=i/L.n*Math.PI*2+li*.33, pts=[], S=12;
      const spine=t=>[0,t*L.len,-L.bend*L.len*t*t];
      const hw=t=>L.w*L.len*Math.sin(Math.PI*Math.pow(t,.8));
      const loc=[];
      for(let s=0;s<=S;s++){ const t=s/S,[,y,z]=spine(t); loc.push([-hw(t),y,z]); }
      for(let s=S;s>=0;s--){ const t=s/S,[,y,z]=spine(t); loc.push([hw(t),y,z]); }
      const co=Math.cos(L.open), so=Math.sin(L.open), ca=Math.cos(ang), sa=Math.sin(ang);
      const world=loc.map(([x,y,z])=>{
        const y1=y*co-z*so, z1=y*so+z*co;
        return [x*ca+z1*sa, y1, -x*sa+z1*ca];
      });
      const rib=[]; for(let s=0;s<=S;s++){ const t=s/S,[,y,z]=spine(t);
        const y1=y*co-z*so, z1=y*so+z*co; rib.push([z1*sa,y1,z1*ca]); }
      petals.push({world,rib});
    }
  });
  function frame(ts){
    requestAnimationFrame(frame);
    if(document.body.dataset.screen!=='home') return;
    const t=ts/1000*(RM?.15:1);
    smx+=(mx-smx)*.05; smy+=(my-smy)*.05;
    ctx.clearRect(0,0,W,H);
    const R=Math.min(W,H)*.36, cx=W*.5, cy=H*.5;
    const ry=t*.32+smx*1.2, rx=.95+Math.sin(t*.5)*.22+smy*.6;
    const cyy=Math.cos(ry), syy=Math.sin(ry), cxx=Math.cos(rx), sxx=Math.sin(rx);
    const tr=([x,y,z])=>{
      const x1=x*cyy+z*syy, z1=-x*syy+z*cyy;
      const y2=y*cxx-z1*sxx, z2=y*sxx+z1*cxx;
      return [x1,y2,z2];
    };
    const pj=([x,y,z])=>{ const p=3.2/(3.2-z); return [cx+x*R*p, cy-y*R*p+R*.1, z]; };
    const list=petals.map(p=>{
      const w=p.world.map(tr).map(pj), r=p.rib.map(tr).map(pj);
      return {w,r,z:w.reduce((s,q)=>s+q[2],0)/w.length};
    }).sort((a,b)=>a.z-b.z);
    ctx.globalCompositeOperation='lighter';
    // yadro nuri
    const pulse=.85+.15*Math.sin(t*1.6);
    const g=ctx.createRadialGradient(cx,cy+R*.1,0,cx,cy+R*.1,R*.34*pulse);
    g.addColorStop(0,'rgba(240,200,255,.9)'); g.addColorStop(.25,'rgba(170,90,255,.7)'); g.addColorStop(1,'rgba(90,30,200,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy+R*.1,R*.34*pulse,0,7); ctx.fill();
    for(const p of list){
      const depth=Math.max(.25,Math.min(1,(p.z+1)/2+.25));
      ctx.beginPath();
      p.w.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath();
      ctx.fillStyle=`rgba(130,80,255,${.07*depth})`; ctx.fill();
      ctx.strokeStyle=`rgba(236,218,255,${.55*depth})`; ctx.lineWidth=1.1; ctx.stroke();
      ctx.beginPath();
      p.r.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
      ctx.strokeStyle=`rgba(190,140,255,${.35*depth})`; ctx.lineWidth=.8; ctx.stroke();
    }
  }
  requestAnimationFrame(frame);
})();
</script>
